  <!-- End breadcrumbs -->

  <md-content class="md-hue-1" perfect-scrollbar>
    <div class="projects-container" layout="row" flex="100" layout-wrap>
      <div ng-repeat="script in sharedData.project.scripts | filter:sharedData.searchScripts" layout="row" flex="25" class="project ms-card"> 
        <div class="ms-card-content-wrapper" style="border-left: 3px solid #2E62B1;">

          <div class="text-nowrap-ellipsis h2 p-16">
            <a href="javascript:void(0)" ng-click="clickScript($event, script)"class="md-primary-fg">
              <md-tooltip>{{script.name}}</md-tooltip>
              {{script.name}}
            </a>
          </div>

          <div class="creator ph-16 pb-16" layout="row" layout-align="start center">
            <img class="avatar mr-16" ng-src="styles/img/avatars/male.png">
            <div layout="column" flex>
              <div class="title" layout="row" layout-align="start center">
                <a href="javascript:void(0)" class="text-nowrap-ellipsis" flex>
                  <md-tooltip>{{script.creator.first_name}} {{script.creator.last_name}}</md-tooltip>
                  {{script.creator.first_name}} {{script.creator.last_name}}
                </a>
                <span class="text" flex>created on</span>
              </div>
              <div class="subtitle secondary-text">{{script.created_date}}</div>
            </div>
          </div>

          <md-divider></md-divider>

          <authorization data-feature="project" data-action="manage_performance">
            <div layout="row" layout-align="start center">
              <md-button class="md-icon-button" aria-label="Clone this case" ng-click="clone($event, script._id, script.name)">
                <md-tooltip>Clone this script</md-tooltip>
                <md-icon class="s16 deep-orange-fg" md-font-icon="icon-content-duplicate" aria-hidden="true"></md-icon>
              </md-button>
              <span flex></span>
              <md-button class="md-icon-button" aria-label="Delete this case" ng-click="delete($event, script._id)">
                <md-tooltip>Delete</md-tooltip>
                <md-icon class="s16 md-warn-fg" md-font-icon="icon-delete" aria-hidden="true"></md-icon>
              </md-button>
            </div>
          </authorization>
          
        </div>
      </div>
    </div>
  </md-content>

</div>
