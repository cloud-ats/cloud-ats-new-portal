<div class="search-box" layout="row" layout-align="start center" flex>
  <md-icon md-font-icon="icon-magnify" class="icon s24 mh-16" aria-hidden="true"></md-icon>
  <input class="font-size-14" type="text" placeholder="Search for data driven" aria-invalid="false" flex ng-model="sharedData.searchDataDriven">

  <authorization data-feature="project" data-action="manage_functional">
    <md-button class="md-icon-button" aria-label="Create New Data Driven" ng-click="addNewDataDriven($event)">
      <md-tooltip>
        Create New Data Driven
      </md-tooltip>
      <md-icon md-font-icon="icon-plus" aria-hidden="true"></md-icon>
    </md-button>  
  </authorization>
</div>
