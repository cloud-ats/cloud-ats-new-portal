<md-dialog aria-label="Schedule" style="width: 45%; min-width: 45%"  ng-cloak >
    <md-toolbar>
      <div class="md-toolbar-tools md-primary-bg">
        <span flex="95" class="md-title text-nowrap">Schedule Functional</span>
        <md-button ng-click="cancel()" aria-label="cancel">
          <md-icon md-font-icon="icon-cancel" flex="5" ></md-icon>
        </md-button>
      </div>
    </md-toolbar>
    <md-dialog-content style="padding: 0px;">
      <div class="md-dialog-content" style="padding: 3px;">
        <form name="stepper" class="ms-stepper" style="max-height: 650px;max-width: 550px;">
          <div class="ms-stepper-horizontal">
            <div class="ms-stepper-navigation-wrapper">
              <div class="ms-stepper-navigation" layout="row" layout-align="center center">
                <md-button class="ms-stepper-navigation-item exe-step" layout="row" layout-align="start center" aria-label="1 Setting time">
                  <div class="step md-accent-bg" layout="row" layout-align="center center">
                    <span>1</span>
                  </div>
                  <div layout="column" layout-align="start start">
                    <div>Time</div>
                  </div>
                </md-button>
                <md-button class="ms-stepper-navigation-item exe-step" layout="row" layout-align="start center" aria-label="2 Choose Suites">
                  <div class="step md-accent-bg" layout="row" layout-align="center center">
                    <span>2</span>
                  </div>
                  <div layout="column" layout-align="start start">
                    <div>Suites</div>
                  </div>
                </md-button>
                <md-button class="ms-stepper-navigation-item exe-step" layout="row" layout-align="start center" aria-label="3 Choose Browsers">
                  <div class="step md-accent-bg" layout="row" layout-align="center center">
                    <span>3</span>
                  </div>
                  <div layout="column" layout-align="start start">
                    <div>Browsers</div>
                  </div>
                </md-button>
                <md-button class="ms-stepper-navigation-item exe-step" layout="row" layout-align="start center" aria-label="4 Selenium Version">
                  <div class="step md-accent-bg" layout="row" layout-align="center center">
                    <span>4</span>
                  </div>
                  <div layout="column" layout-align="start start">
                    <div>Selenium</div>
                  </div>
                </md-button>
                <md-button class="ms-stepper-navigation-item exe-step" layout="row" layout-align="start center" aria-label="5 Choose OS">
                  <div class="step md-accent-bg" layout="row" layout-align="center center">
                    <span>5</span>
                  </div>
                  <div layout="column" layout-align="start start">
                    <div>OS</div>
                  </div>
                </md-button>
                
              </div>
            </div>
            
            <div class="ms-stepper-steps" style="padding: 2px 2px;">
              <ms-stepper-step id="1" step-title="'Setting Time'" class="ms-stepper-step" ng-show="currentStep === 1" >
                <div layout="row" class="exe-step">
                  <md-input-container flex="100">
                  <label>name</label>
                  <input ng-model="schedule.name">
                </md-input-container>
                </div>
                <div layout="row" class="exe-step">
                  <md-input-container flex-gt-md="35">
                    <label>Hour</label>
                    <input ng-model="schedule.hour" type="number" max="23" min="0">
                  </md-input-container>
                  <md-input-container flex-gt-md="35">
                    <label>Minute</label>
                    <input ng-model="schedule.minute" type="number" max="59" min="0">
                  </md-input-container>
                </div>
                <div layout="row" class="exe-step" flex="100">
                  <md-radio-group layout="row" ng-model="modSchedule" flex="100"> 
                    <md-radio-button value="OnlyDate" flex="40">OnlyDate</md-radio-button>
                    <md-radio-button value="RepeatDate" flex="40">Repeat Date</md-radio-button>
                  </md-radio-group>
                </div>
                <div layout="row" class="exe-step" ng-show="modSchedule === 'OnlyDate'">
                  <md-datepicker ng-model="schedule.day" md-placeholder="Select Date"></md-datepicker>
                </div>
                <div layout="column" class="exe-step" ng-show="modSchedule === 'RepeatDate'">
                  <div flex-xs>
                    <md-checkbox aria-label="Select All"
                                 md-indeterminate="isIndeterminate()"
                                 ng-click="toggleAll()">
                      <span ng-if="isChecked()"></span>Select All
                    </md-checkbox>
                  </div>
                  <div ng-repeat="item in ListDateInit" class="schedule-select">
                    <md-checkbox ng-checked="exists(item, schedule.dateRepeat)" ng-click="toggle(item, schedule.dateRepeat)">
                     {{ item }}
                    </md-checkbox>
                  </div>
                </div>
              </ms-stepper-step>

              <ms-stepper-step id="2" step-title="'Choose Suites'" class="ms-stepper-step" ng-show="currentStep === 2" >
                  <div class="md-padding" layout="column">
                      <div layout="row" flex=>
                        <div class="search-box" layout="row" layout-align="start center" flex style="margin-bottom: 16px;">
                          <md-icon md-font-icon="icon-magnify" class="icon s24 margin-left-0" aria-hidden="true"></md-icon>
                          <input class="font-size-14" type="text" placeholder="Search for suite name" aria-invalid="false" flex ng-model="searchTerms"> 
                          <a href-void ng-show="searchTerms" ng-click="searchTerms = undefined;"><md-icon md-font-icon="icon-close"></md-icon></a>  
                        </div>
                      </div>
                      <div layout="column">
                            <div layout="row" layout-wrap flex>
                              <div class="demo-select-all-checkboxes" flex="100" ng-repeat="suite in suites | filter : searchTerms">
                                <md-checkbox aria-label="selectSuite" ng-click="selectSuite(suite._id);">
                                 <span>{{ suite.name }}</span>
                                </md-checkbox>
                              </div>
                            </div>
                      </div>
                  </div>
              </ms-stepper-step>

              <ms-stepper-step id="3" step-title="'Choose Browsers'" class="ms-stepper-step" ng-show="currentStep === 3">
                <div class="md-padding">
                  <md-radio-group ng-model="project.browser">
                    <div layout="column">
                      <div layout="row">
                        <div layout='row'layout-padding layout-align="start center" >
                        <md-radio-button value="firefox" aria-label="firefox">
                          <img ng-src="/styles/img/browsers/firefox.jpg" width="30" height="30">
                        </md-radio-button>
                        </div>
                        <div layout='row' >
                          <div layout="row" layout-align="start center" ng-show="false">
                            <md-select ng-model="browserVersionFireFox" aria-label="firefoxVersion">
                              <md-option selected="selected">41.0.2</md-option>
                              <md-option>38.3.0esr</md-option>
                              <md-option>26.0</md-option>
                              <md-option>17.0.9esr</md-option>
                            </md-select>
                          </div>
                        </div>
                      </div>
                      <div layout="row">
                        <div layout='row'layout-padding layout-align="start center" >
                        <md-radio-button value="chrome" aria-label="chrome">
                          <img ng-src="/styles/img/browsers/chrome.jpg" width="30" height="30">
                        </md-radio-button>
                      </div>
                      <div layout='row' >
                        <div layout="row" layout-align="start center" ng-show="false">
                          <md-select ng-model="browserVersionChrome" aria-label="chromeVersion">
                            <md-option selected="selected">46.0.2490.80</md-option>
                          </md-select>
                        </div>
                      </div>
                      </div>
                      <div layout="row">
                        <div layout='row'layout-padding layout-align="start center" >
                          <md-radio-button value="ie" aria-label="ie">
                            <img ng-src="/styles/img/browsers/ie.png" width="30" height="30">
                          </md-radio-button>
                        </div>
                        <div layout='row' >
                          <div layout="row" layout-align="start center" ng-show="false">
                            <md-select ng-model="browserVersionIE" aria-label="ieVersion">
                              <md-option selected="selected">11</md-option>
                            </md-select>
                          </div>
                        </div>
                      </div>
                    </div>
                   </md-radio-group>
                </div>
              </ms-stepper-step>

              <ms-stepper-step id="4" step-title="'Version Selenium'" class="ms-stepper-step" ng-show="currentStep === 4">
                <div class="md-padding">
                      <div layout="column">
                        <div layout="row">
                          <div layout='row'layout-padding layout-align="start center" >
                            <md-checkbox ng-model="selenium" aria-label="selenium" ng-disabled="true" ng-init="selenium=true">
                              <img ng-src="/styles/img/selenium.png" width="30" height="30">
                            </md-checkbox>
                          </div>
                          <div layout='row' >
                            <div layout="row" layout-align="start center">
                              <md-select ng-model="project.seleniumVersion" aria-label="seleniumVersion">
                                <md-option selected="selected">2.48.2</md-option>
                                <md-option>2.47.1</md-option>
                                <md-option>2.46.0</md-option>
                                <md-option>2.45.0</md-option>
                                <md-option>2.44.0</md-option>
                                <md-option>2.43.1</md-option>
                                <md-option>2.42.0</md-option>
                                <md-option>2.41.0</md-option>
                              </md-select>
                            </div>
                          </div>
                        </div>
                        <div layout="row">
                          <div layout='row'layout-padding layout-align="start center">
                            <md-checkbox aria-label="delayTime" ng-model="checkDelayTime">
                              <span>Delay Time (s)</span>
                            </md-checkbox>
                            <md-input-container ng-if="checkDelayTime">
                              <input type="number" min="1" max="100" aria-label="time" class="text-center" ng-model="project.value_delay">
                            </md-input-container>
                          </div>
                        </div>
                      </div>
                  </div>
              </ms-stepper-step>

              <ms-stepper-step id="5" step-title="'Version OS'" class="ms-stepper-step" ng-show="currentStep === 5">
                  <div class="md-padding">
                    <!-- <md-radio-group ng-model="project.os">
                      <div layout="column">
                        <div layout="row" ng-hide="true">
                          <div layout='row'layout-padding layout-align="start center" >
                          <md-radio-button value="ubuntu" aria-label="ubuntu">
                            <img ng-src="/styles/img/ubuntu.png" width="30" height="30">
                          </md-radio-button>
                        </div>
                        <div layout='row' >
                          <div layout="row" layout-align="start center">
                            <span>Ubuntu 14.04 64bit</span>
                         </div>
                        </div>
                        </div>
                        <div layout="row">
                          <div layout='row'layout-padding layout-align="start center" >
                          <md-radio-button value="window" aria-label="window" ng-checked>
                            <img ng-src="/styles/img/window.jpg" width="30" height="30">
                          </md-radio-button>
                        </div>
                        <div layout='row' >
                          <div layout="row" layout-align="start center">
                            <span>Windows</span>
                         </div>
                        </div>
                        </div>
                      </div>
                     </md-radio-group> -->
                     <div layout='row'layout-padding layout-align="start center" >
                      <md-checkbox ng-model="project.os" aria-label="selenium" ng-disabled="true" ng-init="project.os=true">
                        <img ng-src="/styles/img/window.jpg" width="30" height="30">
                      </md-checkbox>
                    </div>
                  </div>
              </ms-stepper-step>
              
            </div>
           
          </div>
        </form>
      </div>
    </md-dialog-content>
    <md-dialog-actions layout="row" >
       <div class="ms-stepper-controls layout-align-center-center layout-row" layout="row" layout-align="center center">
              <button class="md-accent md-raised md-button md-ink-ripple md-default-theme" type="button" aria-label="Back" ng-disabled="currentStep === 1"
              ng-click="backStepExecution()">
                <span class="ng-scope">Back</span>
                <div class="md-ripple-container"></div>
              </button>
              <button class="md-accent md-raised md-button ng-scope md-ink-ripple md-default-theme" type="button" aria-label="Next" ng-disabled="currentStep === 5 || checkSuiteSelected" ng-click="nextStepExecution()">
                <span class="ng-scope">Next</span>
              </button>
              <button  class="md-accent md-raised md-button ng-scope md-ink-ripple md-default-theme" type="button" aria-label="Save" ng-disabled="currentStep !== 5" ng-click="saveSchedule()">
                <span class="ng-scope">SAVE</span>
              </button>
            </div>
    </md-dialog-actions>
</md-dialog>
